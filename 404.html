<script>
// Minimal, standalone language switcher for this page only — links to the
// equivalent /{lang}/ homepage rather than trying to preserve a specific
// deep link, since we don't know what the visitor was actually looking for.
(function(){
  var LANG_NAMES = {en:"English",zh:"中文",ru:"Русский",de:"Deutsch",it:"Italiano",fr:"Français",ar:"العربية",ja:"日本語",ko:"한국어",sk:"Slovenčina",cs:"Čeština"};
  var sel = document.createElement('select');
  Object.keys(LANG_NAMES).forEach(function(code){
    var opt = document.createElement('option');
    opt.value = code; opt.textContent = LANG_NAMES[code];
    sel.appendChild(opt);
  });
  sel.addEventListener('change', function(){
    window.location.href = this.value === 'en' ? '/' : '/' + this.value + '/';
  });
  document.querySelector('.lang-switcher').appendChild(sel);
})();
